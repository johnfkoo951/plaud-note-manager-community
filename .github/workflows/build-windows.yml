name: Build Windows Community archive

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          architecture: x64

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.7

      - name: Run deterministic tests
        shell: pwsh
        run: |
          uv sync --group dev
          $env:PLAUD_SECRET_STORE = "test-file"
          $env:PLAUD_AUTO_REFRESH = "0"
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .

      - name: Build and statically audit portable archive
        run: python scripts/package-windows-portable.py

      - name: Run packaged Windows and DPAPI self-test
        shell: pwsh
        run: |
          $archive = Get-ChildItem "dist/*-Windows-x64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows archive was not produced" }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "dist/native-test"
          $runtime = "dist/native-test/Plaud Note Manager Community/runtime/python.exe"
          & $runtime -I -B -m windows_app --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows self-test failed" }

      - name: Upload verified archive and checksum manifest
        uses: actions/upload-artifact@v7
        with:
          name: plaud-note-manager-community-windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
